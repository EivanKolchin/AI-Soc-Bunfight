<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="shared/file-guard.js"></script>
<script src="shared/device.js"></script>
<title>AI SOCIETY - BUNFIGHT</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; background:#050507; overflow:hidden; }
  :root { --qr:clamp(120px,13vw,230px); }
  .phone { --qr:92px; }
  [hidden] { display:none !important; }
  .frame { position:fixed; inset:0; width:100%; height:100%; border:0; display:none; }
  .frame.on { display:block; }
  #switcher {
    position:fixed; left:50%; bottom:8px; transform:translateX(-50%);
    display:flex; gap:6px; z-index:10; font-family:"Helvetica Neue",Arial,sans-serif;
    opacity:.25; transition:opacity .2s;
  }
  #switcher:hover { opacity:1; }
  .chip { font-size:11px; letter-spacing:.1em; font-weight:700; color:#fff;
          background:rgba(255,255,255,.1); padding:4px 10px; border-radius:2px;
          cursor:pointer; text-transform:uppercase; }
  .chip.on { background:#00E5FF; color:#000; }
  .chip.warm::after { content:" \25CF"; color:#B4FF2E; }
  .phone #switcher { display:none; }            /* phones get the top-left button instead */
  @media (max-width:800px) {                     /* narrow window: centred, it would run under the QR card */
    #switcher { left:12px; transform:none; }
  }

  /* QR card (media/aisoc-qr.svg, built by tools/make-qr.mjs). The demos keep
     their text out of this corner: --qr there matches --qr here. */
  #qr { position:fixed; right:16px; bottom:16px; z-index:11; width:var(--qr); padding:0;
        border:0; background:none; cursor:zoom-in; display:block; line-height:0;
        border-radius:calc(var(--qr) * .1143);
        box-shadow:0 12px 34px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
        transition:transform .2s; -webkit-tap-highlight-color:transparent; }
  #qr:hover { transform:translateY(-3px); }
  #qr img, #qrBig img { display:block; width:100%; height:auto; }

  /* full-screen QR, for scanning from across the stall. The card is 8/7 as
     tall as it is wide, so its width is also capped by the screen height. */
  #qrFull { --big:min(640px, 86vw, calc((100vh - 150px) * .875));
            position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
            align-items:center; justify-content:center; gap:22px; padding:24px;
            background:rgba(8,5,16,.88); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
            font-family:"Helvetica Neue",Arial,sans-serif; color:#fff; animation:qrIn .22s ease-out; }
  #qrBig { width:var(--big); border-radius:calc(var(--big) * .1143); overflow:hidden;
           box-shadow:0 30px 90px rgba(124,58,237,.45), 0 0 0 1px rgba(255,255,255,.12); }
  #qrFull p { font-size:clamp(13px,1.6vw,18px); letter-spacing:.14em; text-transform:uppercase;
              text-align:center; opacity:.75; }
  #qrFull a { color:#C4B5FD; text-decoration:none; font-weight:800; }
  #qrClose { position:absolute; top:14px; right:14px; width:44px; height:44px; border-radius:50%;
             border:1px solid rgba(255,255,255,.25); background:rgba(255,255,255,.08); color:#fff;
             cursor:pointer; display:flex; align-items:center; justify-content:center; }
  #qrClose:hover { background:rgba(255,255,255,.18); }
  #qrClose svg { width:18px; height:18px; }
  @keyframes qrIn { from { opacity:0; transform:scale(.97); } to { opacity:1; transform:none; } }

  /* phone-only controls */
  .ctl { position:fixed; top:12px; z-index:12; height:44px; display:flex; align-items:center;
         gap:8px; padding:0 16px 0 12px; border-radius:22px; cursor:pointer;
         border:1px solid rgba(255,255,255,.22); background:rgba(10,10,14,.62);
         -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); color:#fff;
         font:800 13px/1 "Helvetica Neue",Arial,sans-serif; letter-spacing:.08em;
         text-transform:uppercase; -webkit-tap-highlight-color:transparent;
         transition:transform .12s, background .12s; }
  .ctl:active { transform:scale(.94); background:rgba(0,229,255,.28); }
  .ctl svg { width:20px; height:20px; flex:none; }
  #swap { left:12px; }
  #swap svg { color:#00E5FF; }
  #flip { right:12px; width:44px; padding:0; justify-content:center; }
  #flip.spin svg { transition:transform .35s; transform:rotate(180deg); }
</style>
</head>
<body>
<div id="switcher"></div>

<button id="swap" class="ctl" hidden aria-label="Switch demo">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4 3 8l4 4"/><path d="M3 8h13a4 4 0 0 1 4 4"/><path d="m17 20 4-4-4-4"/><path d="M21 16H8a4 4 0 0 1-4-4"/></svg>
  <span id="swapLabel"></span>
</button>
<button id="flip" class="ctl" hidden aria-label="Switch camera" title="Switch camera">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.6-2.4A1.5 1.5 0 0 1 9.9 5h4.2a1.5 1.5 0 0 1 1.3.6L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><path d="M9.2 12.4a3 3 0 0 1 5.1-1.2"/><path d="M14.8 14.6a3 3 0 0 1-5.1 1.2"/><path d="m14.6 9.4-.2 1.9-1.9-.2"/><path d="m9.4 17.6.2-1.9 1.9.2"/></svg>
</button>

<button id="qr" type="button" aria-label="Show the QR code full screen" title="linktr.ee/AISoc">
  <img src="media/aisoc-qr.svg" alt="QR code for linktr.ee/AISoc">
</button>

<div id="qrFull" hidden role="dialog" aria-modal="true" aria-label="AI Society QR code">
  <button id="qrClose" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
  </button>
  <div id="qrBig"><img src="media/aisoc-qr.svg" alt="QR code for linktr.ee/AISoc"></div>
  <p>Scan with your phone camera &middot; <a href="https://linktr.ee/AISoc" target="_blank" rel="noopener">linktr.ee/AISoc</a></p>
</div>

<script>
/* One shell, BOTH demos kept alive.
   Switching used to swap one iframe's src, which re-downloaded the model,
   rebuilt the MediaPipe graph and re-opened the camera every time - several
   seconds of black screen at a stall. Now each demo gets its own iframe: the
   first loads immediately, the second is warmed up in the background once the
   first says it is ready, and switching just toggles which one is visible.
   The hidden demo is told to pause its loop (no detection, no CPU) and keeps
   its camera stream, so switching back is instant.

   Phones differ: they allow one camera capture at a time (iOS stops the older
   stream the moment another opens), and a second model loading in the
   background costs memory and battery. So on a phone the second demo loads
   only when asked for, and the hidden one lets go of the camera. */
const DEMOS = [
  { key:"1", name:"Mood",       src:"demos/mood.html" },
  { key:"2", name:"Pictionary", src:"demos/pictionary.html" },
];
const WARMUP_FALLBACK_MS = 9000;   // warm the second demo even if the first never says ready
const PHONE = !!window.IS_PHONE;

const bar = document.getElementById("switcher");
const frames = {};                 // key -> iframe
let currentKey = null;
let facing = "user";               // phone only: front or back camera, shared by both demos

function ensureFrame(key) {
  if (frames[key]) return frames[key];
  const d = DEMOS.find(x => x.key === key);
  const f = document.createElement("iframe");
  f.className = "frame";
  f.setAttribute("allow", "camera; microphone; fullscreen");
  f.dataset.key = key;
  f.src = d.src + (PHONE ? "?facing=" + facing : "");
  // messages sent before the demo is listening are lost, so repeat its state on load
  f.addEventListener("load", () => tell(f, f.dataset.key === currentKey));
  document.body.insertBefore(f, bar);
  frames[key] = f;
  return f;
}

function tell(f, visible) {
  try {
    f.contentWindow.postMessage({ type: "visibility", visible, facing,
                                  release: PHONE && !visible }, "*");
  } catch (e) {}
}

function go(key) {
  const d = DEMOS.find(x => x.key === key);
  if (!d || key === currentKey) return;
  currentKey = key;
  const f = ensureFrame(key);
  // hidden ones first, so on a phone the camera is let go before it is wanted
  for (const k in frames) if (k !== key) { frames[k].classList.remove("on"); tell(frames[k], false); }
  f.classList.add("on");
  tell(f, true);
  try { f.contentWindow.focus(); } catch (e) {}
  f.addEventListener("load", () => { try { f.contentWindow.focus(); } catch (e) {} }, { once: true });
  for (const c of bar.children) c.classList.toggle("on", c.dataset.key === key);
  document.getElementById("swapLabel").textContent = DEMOS.find(x => x.key !== key).name;
  try { localStorage.setItem("lastDemo", key); } catch (e) {}
}

// warm up every demo that is not loaded yet, one at a time (desktop only)
let warming = false;
function warmNext() {
  if (warming || PHONE) return;
  const next = DEMOS.find(d => !frames[d.key]);
  if (!next) return;
  warming = true;
  ensureFrame(next.key);
}

for (const d of DEMOS) {
  const c = document.createElement("div");
  c.className = "chip"; c.dataset.key = d.key;
  c.textContent = d.key + " " + d.name;
  c.onclick = () => go(d.key);
  bar.appendChild(c);
}

if (PHONE) {
  const swap = document.getElementById("swap"), flip = document.getElementById("flip");
  swap.hidden = flip.hidden = false;
  swap.onclick = () => go(DEMOS.find(d => d.key !== currentKey).key);
  flip.onclick = () => {
    facing = facing === "user" ? "environment" : "user";
    flip.classList.toggle("spin", facing === "environment");
    if (frames[currentKey]) tell(frames[currentKey], true);
  };
}

addEventListener("message", (e) => {
  if (!e.data) return;
  if (e.data.demo) go(String(e.data.demo));
  if (e.data.type === "ready") {
    // mark the chip of whichever frame sent it, then warm the next demo
    for (const k in frames) if (frames[k].contentWindow === e.source) {
      const chip = [...bar.children].find(c => c.dataset.key === k);
      if (chip) chip.classList.add("warm");
    }
    warming = false;
    warmNext();
  }
});

// QR: the corner card opens a full-screen copy; the X, Esc or a tap outside closes it
const qrFull = document.getElementById("qrFull");
function showQr(on) {
  qrFull.hidden = !on;
  if (on) document.getElementById("qrClose").focus();   // so Esc reaches this page
}
document.getElementById("qr").onclick = () => showQr(true);
document.getElementById("qrClose").onclick = () => showQr(false);
qrFull.addEventListener("click", (e) => { if (e.target === qrFull) showQr(false); });

// Keys must work wherever focus happens to be: forward anything we do not
// handle to the ACTIVE demo, which cannot hear them unless it has focus.
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !qrFull.hidden) { showQr(false); return; }
  if (DEMOS.some(d => d.key === e.key)) { go(e.key); return; }
  if (e.key.toLowerCase() === "f") { document.documentElement.requestFullscreen(); return; }
  const f = frames[currentKey];
  if (f) try { f.contentWindow.postMessage({ type: "key", key: e.key, code: e.code }, "*"); } catch (err) {}
});
addEventListener("click", () => {
  if (!qrFull.hidden) return;                  // keep focus here while the QR is open
  const f = frames[currentKey]; if (f) try { f.contentWindow.focus(); } catch (e) {}
});

let start = "1";
try { start = localStorage.getItem("lastDemo") || "1"; } catch (e) {}
go(start);
setTimeout(() => { warming = false; warmNext(); }, WARMUP_FALLBACK_MS);
</script>
</body>
</html>
